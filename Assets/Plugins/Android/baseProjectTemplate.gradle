plugins {
    // If you are changing the Android Gradle Plugin version, make sure it is compatible with the Gradle version preinstalled with Unity
    // See which Gradle version is preinstalled with Unity here https://docs.unity3d.com/Manual/android-gradle-overview.html
    // See official Gradle and Android Gradle Plugin compatibility table here https://developer.android.com/studio/releases/gradle-plugin#updating-gradle
    // To specify a custom Gradle version in Unity, go do "Preferences > External Tools", uncheck "Gradle Installed with Unity (recommended)" and specify a path to a custom Gradle version
    id 'com.android.application' version '9.0.0' apply false
    id 'com.android.library' version '9.0.0' apply false
    **BUILD_SCRIPT_DEPS**
}

// Everything above this line is Unity 6000.4.9f1's stock template, copied verbatim. The block below is
// the only thing this project adds, and it exists for one reason:
//
// Before Kotlin 1.8 the standard library shipped as three artifacts — kotlin-stdlib plus the -jdk7 and
// -jdk8 add-ons. In 1.8 the add-ons' classes were folded into kotlin-stdlib itself and the two old
// artifacts became empty shims that only depend on it. This project pulls both generations at once:
// androidx.appcompat and the rest of the androidx stack still ask for kotlin-stdlib-jdk7/jdk8 1.6.21,
// while com.android.billingclient:billing:9.0.0 (Unity IAP 5.4.2) brings kotlin-stdlib 1.8.22. That puts
// kotlin.io.path.PathsKt and eighteen of its neighbours in two jars at once, and
// :launcher:checkReleaseDuplicateClasses stops the build.
//
// Forcing the two old artifacts to 1.8.22 turns them into the empty shims they became in that release,
// so nothing is lost — the classes still ship, once, out of kotlin-stdlib. kotlin-stdlib itself is
// deliberately NOT forced: Gradle already resolves it to the highest version anyone asks for, and
// pinning it here would silently downgrade a future package that needs 2.x.
allprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
